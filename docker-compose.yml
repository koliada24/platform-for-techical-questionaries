services:
  db:
    image: postgres:17-alpine
    container_name: qapp-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qapp}
      POSTGRES_USER: ${POSTGRES_USER:-qapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qapp}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qapp} -d ${POSTGRES_DB:-qapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./Api
      dockerfile: Dockerfile
    container_name: qapp-api
    ports:
      # Host port matches Google OAuth registered redirect URIs (http://localhost:5107/...)
      - "5107:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-qapp};Username=${POSTGRES_USER:-qapp};Password=${POSTGRES_PASSWORD:-qapp}"
      Client__BaseUrl: "http://localhost:5173"
      # Provide via .env file or shell environment; do NOT commit real secrets.
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: qapp-client
    ports:
      # Host port matches the URL configured in API CORS / Client:BaseUrl
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
