services:
  db:
    image: postgres:17-alpine
    container_name: qapp-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qapp}
      POSTGRES_USER: ${POSTGRES_USER:-qapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qapp}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qapp} -d ${POSTGRES_DB:-qapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: qapp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qappminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qappminio}
    ports:
      # S3 API
      - "9000:9000"
      # Web console
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: koliada24/qapp-api:latest
    build:
      context: ./Api
      dockerfile: Dockerfile
    container_name: qapp-api
    ports:
      # Host port matches Google OAuth registered redirect URIs (https://localhost:5107/...)
      - "5107:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Listen HTTPS only. Kestrel picks up the cert from Kestrel:Certificates:Default.
      ASPNETCORE_URLS: https://+:8443
      Kestrel__Certificates__Default__Path: /certs/server.pfx
      Kestrel__Certificates__Default__Password: ${PFX_PASSWORD:-devpassword}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-qapp};Username=${POSTGRES_USER:-qapp};Password=${POSTGRES_PASSWORD:-qapp}"
      Client__BaseUrl: ${PUBLIC_BASE_URL:-https://localhost:5173}
      # Provide via .env file or shell environment; do NOT commit real secrets.
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: ${MINIO_ROOT_USER:-qappminio}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-qappminio}
      Minio__UseSSL: "false"
      Minio__Bucket: ${MINIO_BUCKET:-qapp-answers}
    volumes:
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: koliada24/qapp-client:latest
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: qapp-client
    ports:
      # Host port matches the URL configured in API CORS / Client:BaseUrl
      - "5173:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
